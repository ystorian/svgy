[package]
name = "svgy"
version = "0.2.0"
edition = "2024"
description = "Convert an SVG to optimized icons for all platforms"
license = "MIT OR Apache-2.0"
authors = ["Flavien Scheurer <flavien+svgy@ystorian.com"]
repository = "https://github.com/ystorian/svgy"
readme = "README.md"
publish = true
exclude = [
	".DS_Store",
	".editorconfig",
	".gitignore",
	".github",
	".just",
	".markdownlint.json",
	".vscode",
	"deny.toml",
	"justfile",
	"tests",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `text` is off on purpose: icons are path artwork, and the feature pulls in an
# unmaintained font stack (rustybuzz/ttf-parser, RUSTSEC-2026-0206/0192) for 25
# dependencies svgy never uses. Re-enabling it puts those advisories back; see
# `svg_text::strip_text` for the removal and warning that cover the gap.
resvg = { version = "0.47", default-features = false, features = ["raster-images"] }
oxipng = { version = "10.1", features = ["parallel", "zopfli"], default-features = false }
quick-xml = "0.41"
svgtypes = "0.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = "none"
panic = "abort"


# Profile for GitHub action, used by `.github/workflows/rust.yml`
[profile.ci]
inherits = "dev"
debug = false
incremental = false
opt-level = 0

[profile.ci.package."*"]
debug = false
incremental = false
opt-level = 0
