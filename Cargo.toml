[package]
name = "svgy"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Convert an SVG to optimized icons for all platforms"
license = "MIT OR Apache-2.0"
authors = ["Flavien Scheurer <flavien+svgy@ystorian.com>"]
repository = "https://github.com/ystorian/svgy"
readme = "README.md"
categories = ["development-tools", "command-line-utilities", "multimedia::images"]
publish = true
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "/*.svg", "LICENSE-*"]

[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWRukfafJ1oiG5PP1IKXRgoI7ntXPbys8WUm9ol6oanMKxEtXdbXisri"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# resvg: `text` is off on purpose.
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
oxipng = { version = "10.2", features = ["parallel", "zopfli"], default-features = false }
quick-xml = "0.42"
svgtypes = "0.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = "none"
panic = "abort"


# Profile for GitHub action, used by `.github/workflows/ci-rust.yaml`
[profile.ci]
inherits = "dev"
debug = false
incremental = false
opt-level = 0

[profile.ci.package."*"]
debug = false
incremental = false
opt-level = 0
