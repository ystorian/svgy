# .github/workflows/ci-rust.yaml

name: CI

on:
  schedule:
    # Runs every Monday at 06:00 UTC (Summer: 08:00, Winter: 07:00).
    - cron: 0 6 * * 1
  workflow_dispatch: # Allows manual triggering.
  push:
    # Run on push to branches, ignore push to tags.
    branches:
      - "**"
    tags:
      - "!**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:

  changes:
    name: Workflows
    uses: ystorian/workflows/.github/workflows/detect_changes.yaml@e8851358670fbdc073675919957d35d8a766ad96 # v1.9.1
    permissions:
      contents: read
    with:
      filter: ci


  check:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ystorian/workflows/.github/workflows/check.yaml@e8851358670fbdc073675919957d35d8a766ad96 # v1.9.1
    permissions:
      actions: write # Required to cancel the `test` jobs on failure.
      contents: read
    with:
      tools: cargo-deny
      recipes: check_rust check_deny


  test:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ystorian/workflows/.github/workflows/test_rust.yaml@e8851358670fbdc073675919957d35d8a766ad96 # v1.9.1
    permissions:
      contents: read
    with:
      runners: '["ubuntu-26.04-arm", "windows-11-arm", "macos-26"]'
      rust_version: "1.100"
      clippy_strict: true
      timeout: 5


  cargo-cache-cleanup:
    name: Workflows
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ystorian/workflows/.github/workflows/cargo_cache_cleanup.yaml@e8851358670fbdc073675919957d35d8a766ad96 # v1.9.1
    permissions:
      actions: write # Required to list and delete the cache entries.


  # Set `Require status checks to pass` only to `Workflows / Status check`.
  status:
    name: Workflows
    needs: [changes, check, test]
    if: always()
    uses: ystorian/workflows/.github/workflows/status_check.yaml@e8851358670fbdc073675919957d35d8a766ad96 # v1.9.1
    with:
      needs: ${{ toJSON(needs) }}
