# deny.toml
# Last refresh: 2026-09-21


[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
workspace-default-features = "deny"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]
level = "deny"
rust-version = "1.98"
ignore-rust-version = "workspace"

[licenses]
version = 2
allow = [
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"MIT",
	"MPL-2.0",
	"Unicode-3.0",
	"Zlib",
]

[advisories]
ignore = [
	{ id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, oxvg_optimiser -> oxvg_ast -> paste" },
]
